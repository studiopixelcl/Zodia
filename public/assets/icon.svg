<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo obsidiana arquitectónico -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#121626" />
      <stop offset="60%" stop-color="#080A12" />
      <stop offset="100%" stop-color="#040509" />
    </radialGradient>

    <!-- Gradiente primario de la Z celestial -->
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#818CF8" />
      <stop offset="85%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Gradiente para el anillo orbital -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.6)" />
      <stop offset="50%" stop-color="rgba(129, 140, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0.5)" />
    </linearGradient>

    <!-- Resplandor sutil no invasivo -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Contenedor del icono estilo Apple App Icon -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="115" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Anillo orbital exterior delicado -->
  <g transform="translate(256, 256) rotate(-28)">
    <ellipse cx="0" cy="0" rx="170" ry="62" fill="none" stroke="url(#orbitGrad)" stroke-width="2" stroke-dasharray="6 6" />
    <ellipse cx="0" cy="0" rx="150" ry="50" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1.5" />
    <!-- Satélite / nodo de resonancia -->
    <circle cx="166" cy="-14" r="5" fill="#38BDF8" filter="url(#softGlow)" />
    <circle cx="-166" cy="14" r="4" fill="#F59E0B" filter="url(#softGlow)" />
  </g>

  <!-- Glifo Monograma Zodia "Z" Geométrico & Minimalista -->
  <g filter="url(#softGlow)">
    <!-- Barra superior -->
    <path d="M165 175 L347 175 L325 205 L187 205 Z" fill="url(#zGrad)" />
    
    <!-- Diagonal dinámica -->
    <path d="M347 175 L165 337 L195 337 L347 205 Z" fill="url(#zGrad)" opacity="0.95" />
    
    <!-- Barra inferior -->
    <path d="M165 337 L347 337 L325 307 L187 307 Z" fill="url(#zGrad)" />
  </g>

  <!-- Estrella guía de 4 puntas en el centro focal -->
  <g transform="translate(256, 256)">
    <path d="M0 -22 L4 -5 L22 0 L4 5 L0 22 L-4 5 L-22 0 L-4 -5 Z" fill="#FFFFFF" filter="url(#softGlow)" />
    <circle cx="0" cy="0" r="3.5" fill="#38BDF8" />
  </g>
</svg>
